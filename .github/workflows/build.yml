name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, unit test, and run Minecraft GameTests
        run: ./gradlew build --stacktrace
      - name: Verify distributable
        run: ./scripts/verify-release.sh --skip-build
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: eigenworks-mod
          path: |
            build/libs/eigenworks-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
