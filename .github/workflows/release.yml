name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Require tag to match project version
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version=//p' gradle.properties)"
      - name: Build and verify release JAR
        run: ./scripts/verify-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/libs/eigenworks-${GITHUB_REF_NAME#v}.jar" --verify-tag --generate-notes --title "EigenWorks $GITHUB_REF_NAME"
